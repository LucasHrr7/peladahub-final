<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeladaHub | Gestão de futebol</title>
  <style>
    /* CSS EMBUTIDO PARA GARANTIR CARREGAMENTO */
    body { font-family: 'DM Sans', sans-serif; margin: 0; background-color: #f4f4f4; color: #333; }
    .app-shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar { background: #fff; border-right: 1px solid #ddd; padding: 20px; }
    .content-grid { display: grid; grid-template-columns: 1fr 350px; gap: 2rem; padding: 2rem; }
    .card-jogador { background: white; padding: 1rem; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 10px; }
    @media (max-width: 768px) {
        .app-shell { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h2>PeladaHub</h2>
      <nav>
        <a href="#inicio">Início</a><br>
        <a href="#jogadores">Jogadores</a>
      </nav>
    </aside>
    <main class="content-grid">
      <section>
        <h1>Central da rodada</h1>
        <div id="playersGrid"></div>
        <button id="addPlayer">+ Adicionar jogador</button>
      </section>
    </main>
  </div>

  <dialog id="playerDialog">
    <form method="dialog" id="playerForm">
      <h2>Adicionar jogador</h2>
      <input name="player" required placeholder="Nome do jogador">
      <button type="submit">Confirmar</button>
    </form>
  </dialog>

  <script>
    // LÓGICA INTEGRADA
    const playersGrid = document.getElementById('playersGrid');
    const playerDialog = document.getElementById('playerDialog');
    const playerForm = document.getElementById('playerForm');
    let jogadores = JSON.parse(localStorage.getItem('jogadores')) || [];

    function renderizar() {
        playersGrid.innerHTML = jogadores.map(n => `<div class="card-jogador">${n}</div>`).join('');
    }

    document.getElementById('addPlayer').onclick = () => playerDialog.showModal();
    playerForm.onsubmit = (e) => {
        jogadores.push(playerForm.player.value);
        localStorage.setItem('jogadores', JSON.stringify(jogadores));
        renderizar();
        playerForm.reset();
    };
    renderizar();
  </script>
</body>
</html>
